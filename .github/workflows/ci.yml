name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore PerformativeMail.sln
      - name: Build
        run: dotnet build PerformativeMail.sln --no-restore --configuration Release
      - name: Test
        run: |
          dotnet test tests/Sim.Tests/PerformativeMail.Sim.Tests.csproj --no-build --configuration Release --verbosity minimal
          dotnet test tests/Net.Tests/PerformativeMail.Net.Tests.csproj --no-build --configuration Release --verbosity minimal
          dotnet test tests/Bot.Tests/PerformativeMail.Bot.Tests.csproj --no-build --configuration Release --verbosity minimal
      - name: ContentValidator
        run: dotnet run --project tools/ContentValidator --configuration Release --no-build -- content
      - name: BalanceSim
        run: dotnet run --project tools/BalanceSim --configuration Release --no-build -- content

  worldHash:
    name: worldHash ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      FIXED_SEED: "0x7F3A9C21"
      GOLDEN_WORLD_HASH: "0x821670054873680E"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore tools/SeedViewer/SeedViewer.csproj
      - name: Build
        run: dotnet build tools/SeedViewer/SeedViewer.csproj --no-restore --configuration Release
      - name: Golden worldHash
        run: |
          set -euo pipefail
          out=$(dotnet run --project tools/SeedViewer --configuration Release --no-build -- "$FIXED_SEED")
          printf '%s\n' "$out"
          hash_line=$(printf '%s\n' "$out" | grep '^worldHash ' | head -n 1)
          printf 'runner %s %s\n' "${{ matrix.os }}" "$hash_line"
          if [ "$hash_line" != "worldHash ${GOLDEN_WORLD_HASH}" ]; then
            printf 'expected worldHash %s\n' "$GOLDEN_WORLD_HASH"
            printf 'got %s\n' "${hash_line:-<missing>}"
            exit 1
          fi

  # Godot integration lives in this container, not on the agent host.
  # mono-* is the C# / .NET editor (filename still uses mono).
  godot:
    name: Godot 4.7.2 .NET
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:mono-4.7.2
      options: --user root
    env:
      REQUIRE_DOTNET_8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Verify Godot .NET 4.7.2
        run: bash tools/godot/ci.sh verify
      - name: Import and build game
        run: bash tools/godot/ci.sh import
      - name: Headless boot smoke
        run: bash tools/godot/ci.sh boot
      - name: HUD Control text inspect
        run: bash tools/godot/ci.sh hud
      - name: Inventory overlay Control text inspect
        run: bash tools/godot/ci.sh overlay
      - name: Lobby Control text inspect
        run: bash tools/godot/ci.sh lobby
      - name: Payday draft results Control text inspect
        run: bash tools/godot/ci.sh overlays
      - name: Headless host/join smoke
        run: bash tools/godot/ci.sh join
